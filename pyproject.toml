[project]
name = "toploader"
version = "0.1.0"
description = "A terminal app to track your trading card collection (Pokémon first)."
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "textual-image[textual]>=0.14",
    "httpx>=0.28",
    "pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
toploader = "toploader.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toploader = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
