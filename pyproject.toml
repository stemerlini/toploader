[project]
name = "toploader"
dynamic = ["version"]
description = "A terminal app to track your trading card collection (Pokémon first)."
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "textual-image[textual]>=0.14",
    "httpx>=0.28",
    "pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
build = ["pyinstaller>=6"]

[project.scripts]
toploader = "toploader.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "toploader.__version__"}

[tool.setuptools.package-data]
toploader = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
