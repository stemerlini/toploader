[project]
name = "toploader"
version = "0.1.0"
description = "A terminal app to track your trading card collection (Pokémon first)."
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "textual-image[textual]>=0.14",
    "httpx>=0.28",
    "pillow>=11",
]

[project.scripts]
toploader = "toploader.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toploader = ["*.tcss"]
